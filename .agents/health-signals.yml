# The health checker reads its signals from here. Ships EMPTY on purpose.
# An empty list means the health agent reports "no health signals configured" and exits
# green. It does NOT mean a broken query — see docs/runbooks/agent-routines.md "Health
# signals live in a config file, not in a prompt".
schema: 1
signals: []
