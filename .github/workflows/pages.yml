# .github/workflows/pages.yml — publish the static explainer site (site/) to GitHub Pages.
#
# One-time repository setting required before the first deploy: Settings → Pages →
# Build and deployment → Source: "GitHub Actions". Until that is set, the deploy job
# fails with a clear "Pages is not enabled" error — it never fails a pull request,
# because this workflow only runs on pushes to the default branch (and manual dispatch).
#
# Deliberately NOT part of the gauntlet: the site is documentation, publishes only from
# the default branch, and must never appear in branch protection's required contexts
# (see docs/runbooks/branch-protection.md — a check that does not report on every PR
# must not be required).
#
# TEMPLATE-REPOSITORY-ONLY, and the job guard below enforces it: the site describes the
# TEMPLATE, not any product adopted from it, and a fresh instantiation inherits this
# file before tools/init.sh can remove it — its very first push then fired a deploy
# against a repository where Pages is not enabled, greeting every adopter with a red
# run about content that was never theirs. With the guard, an instantiation shows one
# skipped run at worst; init.sh deletes site/ and this file for good.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Job-level if:, not a paths trick — it must SKIP (reporting nothing red) on
    # every repository generated from this template. See the header.
    if: github.repository == 'galando/agentic-sdlc'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
