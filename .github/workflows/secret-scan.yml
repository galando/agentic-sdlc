# Gate 11 — secret scan. A credential about to leak.
#
# Job id is `fast-secret-scan` and the job carries NO `name:` key, so the
# branch-protection context string is exactly `fast-secret-scan`.
#
# This matters more here than anywhere else, because this is the job that taught
# the lesson. Upstream it had the id `gitleaks` and a `name:` reading "Scan for
# secrets with gitleaks", which made the required-check context the whole
# sentence rather than the short id. GitHub accepts any context string you type,
# including one that will never exist — so requiring the id instead of the
# sentence produces a check that never reports and a pull request that blocks
# forever. One string per gate is one string to get wrong.
name: secret-scan

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  fast-secret-scan:
    runs-on: ${{ vars.PR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # A secret scan needs the FULL history. A shallow clone scans only the
          # tip, so a credential committed earlier in the branch and removed
          # later still ships in the history and this gate reports clean.
          fetch-depth: 0

      # On a PERSISTENT runner a stale scanner temp file left by a previous run
      # makes the scan fail on a path collision. A hosted runner gets a fresh
      # temp directory every run, so this is only needed when the job is routed
      # to a self-hosted one.
      #
      # Clears the real OS temp directory, not a hard-coded /tmp — that
      # hard-coding was itself the bug the first time.
      - name: Clear stale scanner temp files (persistent runner only)
        if: vars.PR_RUNNER != ''
        run: rm -rf "${TMPDIR:-/tmp}"/gitleaks*

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
