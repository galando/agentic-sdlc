# Gate 1's own contract: unit tests, no database, no network. H2 in-memory, Postgres
# compatibility mode so the Flyway migration written for Postgres also applies cleanly
# here without a second copy.
spring:
  datasource:
    url: "jdbc:h2:mem:agentsdlc-test-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
