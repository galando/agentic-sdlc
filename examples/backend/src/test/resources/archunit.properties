# Gate 4's freeze store. allowStoreUpdate=true here is a deliberate choice for this
# reference stack: ArchUnit's own recommended flow is "let CI update the store when a
# violation count SHRINKS, and treat the committed store file itself as the reviewable
# diff" (Architectures rot invisibly while every test stays green — this is what
# actually catches that). The ratchet discipline still holds: this store starts
# committed EMPTY (zero known violations), so an update can only ever record a shrink or
# a legitimately-reviewed new baseline that showed up in the pull request's diff, never a
# silent widening — the same "never hand-edit the store" rule as any other ratchet gate
# in docs/QUALITY-GATES.md.
freeze.store.default.path=archunit_store
freeze.store.default.allowStoreCreation=true
freeze.store.default.allowStoreUpdate=true
